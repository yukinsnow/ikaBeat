[package]
name = "ikabeat"
version = "2.0.0"
description = "Offline music tempo analysis with Essentia"
authors = ["yukinsnow"]
license = "GPL-3.0-only"
repository = "https://github.com/yukinsnow/ikaBeat"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4" }
tauri-plugin-log = "2"
